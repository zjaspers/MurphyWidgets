<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beverage & Food Safety Monitor</title>
  <style>
    :root{
      --bg:#f7f8fb; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
      --soft:#f3f4f6; --blue:#0b4a8b; --red:#dc2626; --amber:#d97706; --green:#059669;
      --redBg:#fff1f2; --amberBg:#fffbeb; --greenBg:#ecfdf5; --blueBg:#eff6ff;
      --shadow:0 10px 30px rgba(17,24,39,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;line-height:1.35;overflow-x:hidden}
    .widget{width:100%;max-width:780px;margin:0 auto;padding:10px;background:var(--bg)}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 10px}
    .section-title h1,.section-title h2{margin:0;font-size:17px;font-weight:850;letter-spacing:-.25px;color:var(--ink)}
    .section-title small{font-size:11px;color:var(--muted);font-weight:750;white-space:nowrap}
    .live-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:10.5px;font-weight:800;color:#374151;box-shadow:0 4px 12px rgba(17,24,39,.04)}
    .pulse{width:7px;height:7px;border-radius:999px;background:var(--green);animation:pulse 1.4s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(5,150,105,.42)}70%{box-shadow:0 0 0 8px rgba(5,150,105,0)}100%{box-shadow:0 0 0 0 rgba(5,150,105,0)}}

    .stack{display:grid;gap:9px;margin-bottom:14px}
    .exception{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .exception:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red)}
    .exception.warn:before{background:var(--amber)}
    .exception.ok:before{background:var(--green)}
    .ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .asset{display:flex;align-items:flex-start;gap:10px;min-width:0}
    .icon{width:34px;height:34px;border-radius:13px;display:grid;place-items:center;background:var(--soft);font-size:17px;flex:0 0 auto}
    .name{font-size:14px;font-weight:850;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
    .meta{font-size:11px;color:var(--muted);font-weight:650;margin-top:2px}
    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:10.5px;font-weight:850;white-space:nowrap}
    .pill.bad{background:var(--redBg);color:var(--red)} .pill.warn{background:var(--amberBg);color:var(--amber)} .pill.good{background:var(--greenBg);color:var(--green)} .pill.info{background:var(--blueBg);color:var(--blue)}
    .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
    .reading-row{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:12px}
    .reading{font-size:33px;line-height:.95;font-weight:900;letter-spacing:-1px;color:var(--ink)}
    .reading span{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:0;margin-left:4px}
    .threshold{text-align:right;font-size:11px;color:var(--muted);font-weight:700}
    .signal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .signal{border:1px solid var(--line);border-radius:14px;padding:9px;background:#fafafa}
    .label{text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-size:9px;font-weight:900}
    .value{font-size:12px;font-weight:850;color:var(--ink);margin-top:2px}

    .panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px}
    .panel-head{padding:12px 12px 9px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
    .panel-head h2{margin:0;font-size:15px;font-weight:850;letter-spacing:-.15px}.panel-head small{font-size:10.5px;color:var(--muted);font-weight:700}
    .rows{display:grid}
    .row{display:grid;grid-template-columns:1.45fr .7fr .8fr;gap:8px;align-items:center;padding:11px 12px;border-bottom:1px solid #f0f2f5}
    .row:last-child{border-bottom:0}
    .row .name{max-width:none;font-size:12.8px}.row .meta{font-size:10.2px}
    .temp{text-align:right;font-size:17px;font-weight:900;letter-spacing:-.3px}.status-cell{text-align:right}
    .empty{background:#fff;border:1px dashed #cfd6e1;border-radius:18px;padding:16px;text-align:center;color:var(--muted);font-weight:750;margin-bottom:12px}
    .hint{font-size:10.5px;color:var(--muted);font-weight:650;margin:8px 2px 2px}
    @media(max-width:520px){.widget{padding:8px}.section-title{align-items:flex-start;flex-direction:column}.signal-grid{grid-template-columns:1fr}.row{grid-template-columns:1.1fr .55fr .7fr;padding:10px}.reading{font-size:29px}.name{max-width:175px}.panel-head{align-items:flex-start;flex-direction:column;gap:2px}}
  </style>
</head>
<body>
<div class="widget">
  <div class="section-title">
    <h1>Active Exceptions</h1>
    <div class="live-chip"><span class="pulse"></span><span id="lastUpdate">Live feed</span></div>
  </div>

  <div id="exceptionStack" class="stack"></div>
  <div id="emptyState" class="empty" style="display:none">All beverage and food safety systems are currently in range.</div>

  <div class="section-title" style="margin-top:6px">
    <h2>Food Safety Temperatures</h2>
    <small>Live threshold readings</small>
  </div>
  <section class="panel">
    <div class="rows" id="foodRows"></div>
  </section>

  <div class="section-title" style="margin-top:12px">
    <h2>Beverage Systems</h2>
    <small>Coke · coffee · ice</small>
  </div>
  <section class="panel">
    <div class="rows" id="bevRows"></div>
  </section>

  <div class="hint">Signals are surfaced from monitoring devices. Tasks are created and completed in WorkJam.</div>
</div>

<script>
const assets = [
  {name:'Walk-In Cooler #1', group:'food', icon:'🥶', type:'Temperature', val:36.4, unit:'°F', min:34, max:40, task:false},
  {name:'Walk-In Cooler #2', group:'food', icon:'🥶', type:'Temperature', val:38.1, unit:'°F', min:34, max:40, task:false},
  {name:'Beverage Cooler #1', group:'food', icon:'🧃', type:'Temperature', val:43.0, unit:'°F', min:34, max:40, task:true, created:'10:42 AM'},
  {name:'Freezer #1', group:'food', icon:'❄️', type:'Temperature', val:-3.0, unit:'°F', min:-10, max:0, task:false},
  {name:'Roller Grill', group:'food', icon:'🌭', type:'Holding Temp', val:147.0, unit:'°F', min:140, max:165, task:false},
  {name:'Coke Freestyle #1', group:'beverage', icon:'🥤', type:'System Health', val:97, unit:'%', min:80, max:100, task:false},
  {name:'Coke Freestyle #2', group:'beverage', icon:'🥤', type:'Syrup Level', val:18, unit:'%', min:20, max:100, task:true, created:'10:31 AM'},
  {name:'Coffee Station #1', group:'beverage', icon:'☕', type:'Brew Readiness', val:94, unit:'%', min:80, max:100, task:false},
  {name:'Coffee Station #2', group:'beverage', icon:'☕', type:'Brew Readiness', val:77, unit:'%', min:80, max:100, task:true, created:'10:36 AM'},
  {name:'Ice Machine', group:'beverage', icon:'🧊', type:'Production Rate', val:91, unit:'%', min:75, max:100, task:false}
];
function status(a){
  if(a.val < a.min || a.val > a.max) return a.val < a.min && a.unit==='%' ? 'warn' : 'bad';
  const spread = a.max-a.min;
  if(spread && (a.val < a.min + spread*.08 || a.val > a.max - spread*.08)) return 'warn';
  return 'good';
}
function labelFor(a){
  const s=status(a);
  if(a.task) return 'Task Sent';
  if(s==='bad') return 'Exception';
  if(s==='warn') return 'Watch';
  return 'Normal';
}
function fmt(a){return `${Number(a.val).toFixed(a.unit==='°F'?1:0)}${a.unit}`}
function range(a){return a.unit==='°F' ? `${a.min}–${a.max}${a.unit}` : `${a.min}–${a.max}${a.unit}`}
function pill(s, text){return `<span class="pill ${s}"><span class="dot"></span>${text}</span>`}
function direction(a){return a.val < a.min ? 'Below threshold' : a.val > a.max ? 'Above threshold' : 'Near threshold'}
function renderExceptions(){
  const ex = assets.filter(a=>a.task);
  document.getElementById('emptyState').style.display = ex.length ? 'none' : 'block';
  document.getElementById('exceptionStack').innerHTML = ex.map(a=>{
    const s=status(a);
    return `<article class="exception ${s==='warn'?'warn':''}">
      <div class="ex-top">
        <div class="asset"><div class="icon">${a.icon}</div><div><div class="name">${a.name}</div><div class="meta">${a.type} · ${direction(a)}</div></div></div>
        ${pill(s, labelFor(a))}
      </div>
      <div class="reading-row">
        <div class="reading">${fmt(a)}<span>now</span></div>
        <div class="threshold">Threshold<br><strong>${range(a)}</strong></div>
      </div>
      <div class="signal-grid">
        <div class="signal"><div class="label">Task Status</div><div class="value">Sent to WorkJam</div></div>
        <div class="signal"><div class="label">WorkJam Signal</div><div class="value">Awaiting response</div></div>
      </div>
      <div class="meta" style="margin-top:8px">Created ${a.created} · Updated by live feed</div>
    </article>`
  }).join('');
}
function row(a){
  const s=status(a);
  return `<div class="row">
    <div class="asset"><div class="icon" style="width:30px;height:30px;border-radius:12px;font-size:15px">${a.icon}</div><div><div class="name">${a.name}</div><div class="meta">${a.type} · ${range(a)}</div></div></div>
    <div class="temp">${fmt(a)}</div>
    <div class="status-cell">${pill(a.task?s:'good', a.task?'Task Sent':(s==='warn'?'Watch':'Normal'))}<div class="meta" style="margin-top:4px">${a.task?'Awaiting WorkJam':'In range'}</div></div>
  </div>`;
}
function renderRows(){
  document.getElementById('foodRows').innerHTML = assets.filter(a=>a.group==='food').map(row).join('');
  document.getElementById('bevRows').innerHTML = assets.filter(a=>a.group==='beverage').map(row).join('');
}
function tick(){
  assets.forEach(a=>{
    if(a.unit==='°F') a.val += (Math.random()-.5)*0.06;
    if(a.unit==='%') a.val += (Math.random()-.52)*0.22;
  });
  document.getElementById('lastUpdate').textContent = 'Live · ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit', second:'2-digit'});
  renderExceptions(); renderRows();
}
tick(); setInterval(tick,1600);
</script>
</body>
</html>
